name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also upload to the Chrome Web Store and submit for review'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    outputs:
      version: ${{ steps.version.outputs.version }}
      zip: ${{ steps.package.outputs.zip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute CalVer version
        id: version
        run: echo "version=$(scripts/calver.sh)" >> "$GITHUB_OUTPUT"

      - name: Build zip
        id: package
        run: echo "zip=$(scripts/package.sh '${{ steps.version.outputs.version }}')" >> "$GITHUB_OUTPUT"

      - name: Verify the packaged manifest
        run: |
          unzip -p "${{ steps.package.outputs.zip }}" manifest.json \
            | grep -q '"version": "${{ steps.version.outputs.version }}"'

      - uses: actions/upload-artifact@v4
        with:
          name: add2arr-${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.zip }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "${{ steps.package.outputs.zip }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes

  chrome-web-store:
    name: Chrome Web Store
    needs: release
    runs-on: ubuntu-latest
    # Never publishes automatically on a push: releasing to the store starts a
    # human review, so it is an explicit, manual decision.
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: add2arr-${{ needs.release.outputs.version }}
          path: dist

      - name: Upload and submit for review
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISH: 'true'
        run: scripts/publish-cws.sh "dist/add2arr-${{ needs.release.outputs.version }}.zip"
